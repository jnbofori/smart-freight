# Smart Freight — single Fly app (API + Vue UI, same origin).
#   fly volumes create smart_freight_data --region yyz --size 1
#   fly secrets set SECRET_KEY="$(openssl rand -hex 32)"
#   fly deploy

app = "smart-freight"
primary_region = "yyz"

[build]

[env]
  COOKIE_SECURE = "true"
  COOKIE_SAMESITE = "lax"
  DATABASE_URL = "sqlite:////data/smart_freight.db"
  STATIC_DIR = "/app/static"
  ROUTING_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "smart_freight_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
